# mise — nvim toolchain stack (editor infra). Active when MISE_ENV contains `hpc`
# (HPC, or any box bootstrapping nvim without Mason). Provides only what nvim itself
# needs to run; formatters/linters are the separate personal stack (config.fmt.toml),
# and the CLI deps it leans on (ripgrep/fd) come from the base CLI tier (step 2.3).
#
# Node-based LSPs (bash-language-server, pyright) are deferred pending the
# node-backend decision — this ships the node-free set. Treesitter parsers build
# from a C compiler (system/module-provided on HPC) + the tree-sitter CLI below.
# See ARCHITECTURE.md §3, §7a.

[tools]
# delta OVERRIDES the base tier's mac pin (config.toml, no matching) with the musl
# static build: the base entry targets the Intel-mac prebuilt, but the gnu linux build
# needs glibc 2.29+ and HPC login nodes sit at 2.28. This hpc-tier entry wins when
# MISE_ENV∋hpc, so the shell and the install both get a delta that runs on the nodes.
"github:dandavison/delta" = { version = "0.18.2", matching = "musl" }
# neovim-releases = upstream's legacy-glibc builds; official 0.12.x binaries need
# glibc 2.32+ and HPC login nodes sit at 2.28. matching pins the tar.gz asset
# (skips .deb/.appimage). Linux-only assets — this tier never runs on the mac.
"github:neovim/neovim-releases" = { version = "0.12.4", matching = ".tar.gz" }
lua-language-server = "3.18.2"
# Backend runtime only (backs the pipx venvs; system python 3.6 predates fortls'
# floor) — deliberately kept OFF the module PATH; sites module-provide user python
python = "3.12"
"pipx:fortls" = "3.2.2" # Fortran LSP (pure-python; no node backend)
# fd is base-tier-excluded only for the Intel-mac prebuilt gap — linux is fine;
# musl clears the glibc-2.28 login nodes (same treatment as eza below).
"github:sharkdp/fd" = { version = "latest", matching = "musl" }
# render-markdown niceties: latex2text (pylatexenc) renders inline latex; gs backs
# PDF/image preview; magick converts non-PNG images (snacks.image). conda-forge's
# 2.17 sysroot again for the glibc floor.
"pipx:pylatexenc" = "latest"
"conda:ghostscript" = "latest"
"conda:imagemagick" = "latest"
# self-contained TeX engine (snacks math rendering) — full TeX Live would be a
# module-sized install; tectonic fetches CTAN packages on demand instead. musl
# for the glibc floor. Not in the mise registry → github backend.
"github:tectonic-typesetting/tectonic" = { version = "latest", matching = "musl" }
# mermaid renderer. One-time per-user step mise can't deliver: the puppeteer browser
# (`npx puppeteer browsers install chrome-headless-shell` → ~/.cache/puppeteer).
# chrome-headless-shell clears glibc 2.28 (full Chrome wouldn't); CDN is reachable.
"npm:@mermaid-js/mermaid-cli" = "latest"
# nvim-treesitter (main) shells out to the tree-sitter CLI for parser builds;
# official binaries need glibc ≥2.29 (Mason's copy died on the 2.28 login nodes) —
# conda-forge builds against a 2.17 sysroot, so this one runs everywhere.
"conda:tree-sitter-cli" = "latest"
# CLI stray riding the linux-only tier: eza has no darwin/amd64 prebuilt and no
# aqua entry, so the base tier can't blanket-pin it — github releases cover linux.
# musl: static, clears the glibc-2.28 login nodes.
"github:eza-community/eza" = { version = "latest", matching = "musl" }
